version: "3.9"

services:

  web:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    container_name: inferencehub_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: inferencehub_worker
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7
    container_name: inferencehub_redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    container_name: inferencehub_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inferencehub
    ports:
      - "5432:5432"